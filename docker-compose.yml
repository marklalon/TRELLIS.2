services:
  trellis2:
    build:
      context: .
      dockerfile: Dockerfile
    image: trellis2:cu128-torch2.7.1
    container_name: trellis2    
    restart: unless-stopped
    runtime: nvidia
    environment:
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      - OPENCV_IO_ENABLE_OPENEXR=1
      - ATTN_BACKEND=flash_attn
      - FLEX_GEMM_AUTOTUNE_CACHE_PATH=/models/.cache/flex_gemm/autotune_cache.json
      - TRITON_CACHE_DIR=/models/.cache/triton
      # Service logs use structured milestones instead of carriage-return bars.
      - TQDM_DISABLE=1
      - HF_HUB_DISABLE_PROGRESS_BARS=1
      - HF_HOME=/workspace/.cache/huggingface
      # Service-mode settings (used by `serve`)
      # Point at the INT8-MLP directory (produced by quantize_offline_int8_mlp.py)
      # to serve quantized weights; the loader auto-detects quantized vs original
      # per checkpoint, so no other flag is needed:
      - TRELLIS2_MODEL_PATH=/models/microsoft/TRELLIS.2-4B-INT8-MLP
      #- TRELLIS2_MODEL_PATH=/models/microsoft/TRELLIS.2-4B
      - TRELLIS2_REMBG_MODEL_PATH=/models/briaai/RMBG-1.4
      - TRELLIS2_PORT=8000
      - TRELLIS2_PIPELINE=1024_cascade
      # Sequential CPU offload of the flow DiTs. Set to 1 on <=16GB GPUs: it pages
      # each 1.3B flow model to the GPU only for its sampling stage, dropping the
      # 1024_cascade peak from ~20.7GB to ~10-11GB (adds a few seconds/request of
      # PCIe transfer). Leave 0 on large-VRAM cards.
      - TRELLIS2_OFFLOAD=decode
      # Run one low-step synthetic request after the model loads. This warms the
      # real generation path (samplers, decode, postprocess/export, Triton/FlexGEMM
      # caches) before the first external client request.
      - TRELLIS2_SYNTHETIC_WARMUP=1
      # Release freed-but-cached allocator blocks at each VAE-decode resolution
      # boundary. Set to 0 to disable.
      - TRELLIS2_DECODE_EMPTY_CACHE=1
      # Cap remesh resolution, reduce remesh_narrow_band_dc VM usage.
      - OVOXEL_REMESH_MAX_RES=512
      - OVOXEL_VRAM_LOG=1
      - TRELLIS2_MEM_FRACTION=0.2
      # expandable_segments repurposes freed blocks across the decoder's growing
      # upsample stages.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      # Mount the project source code (read-write for development)
      - .:/workspace/TRELLIS.2
      # Mount the pretrained model weights (Docker named volume)
      - models:/models:ro
      # Persist FlexGEMM autotune results and Triton kernels without making /models writable.
      - model_cache:/models/.cache
      # Cache HuggingFace downloads (optional but recommended)
      - hf_cache:/workspace/.cache/huggingface
    working_dir: /workspace/TRELLIS.2
    ports:
      # Inference server (HTTP / WebSocket) — vLLM-style service mode
      - "8086:8000"
    # Do not allocate a pseudo-TTY for the service. On Windows, PTY newline
    # conversion can turn each Docker log record into a visible blank line.
    # Run as a persistent service: model stays resident, clients hit HTTP/WS.
    command: serve
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Override `command:` above with `bash` or `python` for other modes.

volumes:
  hf_cache:
  model_cache:
    name: trellis2_model_cache
    external: true
  models:
    external: true
